services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexcart-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "NexCart"
      APP_ENV: local
      APP_KEY: base64:KqZ9c2g7fXz4/0zV4/mQzG1uWq+rT3v8y6zN2b9V5wA=
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nexcart
      DB_USERNAME: nexcart
      DB_PASSWORD: secret_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "support@nexcart.in"
      MAIL_FROM_NAME: "NexCart Marketplace"
      RAZORPAY_KEY_ID: rzp_test_nexcart_2026_demo
      RAZORPAY_KEY_SECRET: secret_test_key_nexcart_9981
      RAZORPAY_WEBHOOK_SECRET: whsec_test_nexcart_sig_5541
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - nexcart-network
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:alpine
    container_name: nexcart-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexcart-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: nexcart-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexcart
      POSTGRES_USER: nexcart
      POSTGRES_PASSWORD: secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nexcart-network

  redis:
    image: redis:7-alpine
    container_name: nexcart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - nexcart-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexcart-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nexcart
      DB_USERNAME: nexcart
      DB_PASSWORD: secret_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - nexcart-network
    depends_on:
      - app
      - postgres
      - redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexcart-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - nexcart-network

networks:
  nexcart-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

